<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Оформление заказа - Драматический театр">
    <title>Оформление заказа - Драматический театр</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="index.html" class="logo" aria-label="На главную">
                <svg class="logo-icon" width="60" height="60" viewBox="0 0 60 60">
                    <circle cx="30" cy="30" r="28" stroke="white" stroke-width="3" fill="none"/>
                    <path d="M 29 60 L 30 1 z" stroke="white" stroke-width="3"/>
                    <circle cx="20" cy="20" r="2" stroke="white" stroke-width="3"/>
                    <circle cx="40" cy="20" r="2" stroke="white" stroke-width="3"/>
                    <path d="M 15 45 L 20 40 L 40 40 L 45 35" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
                </svg>
                <span class="logo-text">Драматический театр</span>
            </a>
            
            <input type="checkbox" class="burger-checkbox" id="burger">

            <label class="burger-label" for="burger">
                <span class="burger-icon">&#8801;</span>
            </label>

            <ul class="burger-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Главная</a></li>
                <li><a href="shows.html" class="nav-link">Афиша</a></li>
                <li>
                    <a href="checkout.html" class="nav-link cart-link active">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                </li>
            </ul>
            
        </nav>
    </header>

    <main class="main">
        <section class="page-header section">
            <div class="container">
                <h1 id="page-title" class="page-title">Оформление заказа</h1>
            </div>
        </section>

        <section class="checkout section">
            <div class="container">
                <form class="checkout-form" id="checkoutForm" novalidate>
                    <fieldset class="form-section">
                        <legend class="form-legend">Контактные данные</legend>
                        
                        <div class="form-group">
                            <label for="fullName" class="form-label">
                                <i class="fas fa-user" aria-hidden="true"></i>
                                Имя и фамилия
                                <span class="required">*</span>
                            </label>
                            <input 
                                type="text" 
                                id="fullName" 
                                name="fullName" 
                                class="form-input" 
                                placeholder="Иван Иванов"
                                required
                            >
                            <span class="form-error" id="fullNameError"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope" aria-hidden="true"></i>
                                Email
                                <span class="required">*</span>
                            </label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-input" 
                                placeholder="ivan@example.com"
                                required
                            >
                            <span class="form-hint">Билеты будут отправлены на этот адрес</span>
                            <span class="form-error" id="emailError"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone" class="form-label">
                                <i class="fas fa-phone" aria-hidden="true"></i>
                                Телефон
                                <span class="required">*</span>
                            </label>
                            <input 
                                type="tel" 
                                id="phone" 
                                name="phone" 
                                class="form-input" 
                                placeholder="+375 (12) 345-67-89"
                                required
                            >
                            <span class="form-error" id="phoneError"></span>
                        </div>
                    </fieldset>
                    
                    <aside class="order-summary checkout-summary" aria-labelledby="order-title">
                        <h2 id="order-title" class="order-title">Ваш заказ</h2>
                        
                        <div class="order-items" id="orderItems">
                            <!--товары загружаются из localStorage-->
                        </div>
                        
                        <div class="order-total">
                            <span class="total-label">Итого:</span>
                            <span class="total-price" id="totalPrice">0 ₽</span>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-credit-card" aria-hidden="true"></i>
                            Оплатить
                        </button>
                    </aside>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Драматический театр. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
