<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Афиша спектаклей - Драматический театр">
    <title>Афиша - Драматический театр</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="index.html" class="logo" aria-label="На главную">
                <svg class="logo-icon" width="60" height="60" viewBox="0 0 60 60">
                    <circle cx="30" cy="30" r="28" stroke="white" stroke-width="3" fill="none"/>
                    <path d="M 29 60 L 30 1 z" stroke="white" stroke-width="3"/>
                    <circle cx="20" cy="20" r="2" stroke="white" stroke-width="3"/>
                    <circle cx="40" cy="20" r="2" stroke="white" stroke-width="3"/>
                    <path d="M 15 45 L 20 40 L 40 40 L 45 35" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
                </svg>
                <span>Драматический театр</span>
            </a>
            
            <input type="checkbox" class="burger-checkbox" id="burger">

            <label class="burger-label" for="burger">
                <span class="burger-icon">&#8801;</span>
            </label>

            <ul class="burger-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Главная</a></li>
                <li><a href="shows.html" class="nav-link active">Афиша</a></li>
                <li>
                    <a href="checkout.html" class="nav-link cart-link">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                </li>
            </ul>
            
        </nav>
    </header>

    <main class="main">
        <section class="page-header section" aria-labelledby="page-title">
            <div class="container">
                <h1 id="page-title" class="page-title">Афиша</h1>
                <p class="page-subtitle">Выберите спектакль для покупки билетов</p>
            </div>
        </section>

        <section class="shows-list section" aria-labelledby="shows-list-title">
            <div class="container">
                <h2 id="shows-list-title" class="visually-hidden">Список спектаклей</h2>
                
                <div class="filters" role="search" aria-label="Фильтр спектаклей">
                    <div class="filter-group">
                        <label for="genreFilter" class="filter-label">Жанр:</label>
                        <select id="genreFilter" class="filter-select">
                            <option value="all">Все жанры</option>
                            <option value="Балет">Балет</option>
                            <option value="Драма">Драма</option>
                            <option value="Концерт">Концерт</option>
                            <option value="Опера">Опера</option>
                        </select>
                    </div>

                </div>
                
                <div class="shows-grid" id="showsGrid">
                    <!--карточки загружаются из XML-->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Драматический театр. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/shows.js"></script>
</body>
</html>
